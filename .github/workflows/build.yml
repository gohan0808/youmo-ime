name: Release

on:
  push:
    tags:
      - "v*"
  # 允许在 GitHub Actions 页面手动触发发布
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.0.0)"
        required: true
        type: string

# 创建 GitHub Release 并上传附件需要 write 权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    runs-on: ubuntu-24.04
    # sherpa-onnx's native build for all four ABIs, R8 and the text pack
    timeout-minutes: 90
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android environment
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # the engine data is unpacked with the SDK's CMake before AGP would install it for the native
      # build; the version is the build's own (Versions.defaultCMake)
      - name: Install build dependencies
        run: |
          cmake=$(sed -n 's/.*defaultCMake = "\([^"]*\)".*/\1/p' build-logic/convention/src/main/kotlin/Versions.kt)
          sdkmanager --install "cmake;${cmake:?no defaultCMake in Versions.kt}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Cache engine data downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads
            !.gradle/engine-downloads/voice
            !.gradle/engine-downloads/handwriting
            !.gradle/engine-downloads/onnxruntime-android-*.zip
          key: engine-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/EngineDataPlugin.kt') }}

      - name: Cache handwriting downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads/handwriting
            .gradle/engine-downloads/onnxruntime-android-*.zip
          key: handwriting-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/HandwritingDataPlugin.kt', 'lib/handwriting/build.gradle.kts') }}

      # [可选] 如果你在 GitHub Secrets 配置了正式签名密钥，可在此还原 keystore；
      # 若未配置 Secret，该步骤会自动跳过，继续使用仓库自带的默认测试签名构建。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build Release APK and the text pack
        env:
          # 如果构建脚本支持通过环境变量读取正式签名，可传入以下 Secrets
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.keystore', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --build-cache :app:assembleRelease :app:packTextPack

      - name: Generate SHA-256 checksums
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} release-assets/ \;
          if [ -d "app/build/packs/" ]; then
            find app/build/packs/ -type f -exec cp {} release-assets/ \;
          fi
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            release-assets/*
