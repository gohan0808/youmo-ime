name: Release

on:
  push:
    tags:
      - "v*"
  # 允许在 GitHub Actions 页面手动触发发布
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.0.0)"
        required: true
        type: string

# 创建 GitHub Release 并上传附件需要 write 权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    runs-on: ubuntu-24.04
    # sherpa-onnx's native build for all four ABIs, R8 and the text pack
    timeout-minutes: 90
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android environment
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # the engine data is unpacked with the SDK's CMake before AGP would install it for the native
      # build; the version is the build's own (Versions.defaultCMake)
      - name: Install build dependencies
        run: |
          cmake=$(sed -n 's/.*defaultCMake = "\([^"]*\)".*/\1/p' build-logic/convention/src/main/kotlin/Versions.kt)
          sdkmanager --install "cmake;${cmake:?no defaultCMake in Versions.kt}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Cache engine data downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads
            !.gradle/engine-downloads/voice
            !.gradle/engine-downloads/handwriting
            !.gradle/engine-downloads/onnxruntime-android-*.zip
          key: engine-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/EngineDataPlugin.kt') }}

      - name: Cache handwriting downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads/handwriting
            .gradle/engine-downloads/onnxruntime-android-*.zip
          key: handwriting-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/HandwritingDataPlugin.kt', 'lib/handwriting/build.gradle.kts') }}

      - name: Setup Pack Signing Key
        env:
          KEY_CONTENT: ${{ secrets.YOUMO_PACK_KEY_PEM }}
        run: |
          # 将 Secret 中的私钥内容写入运行机的临时文件
          echo "$KEY_CONTENT" > "$RUNNER_TEMP/my-pack-key.pem"
          chmod 600 "$RUNNER_TEMP/my-pack-key.pem"
          # 将文件路径写入 GitHub Actions 环境变量 YOUMO_PACK_KEY
          echo "YOUMO_PACK_KEY=$RUNNER_TEMP/my-pack-key.pem" >> "$GITHUB_ENV"

      - name: Build Release APK and Signed Text Pack
        run: |
          ./gradlew :app:assembleRelease :app:packTextPack -PbuildABI=arm64-v8a

      - name: 使用正式证书重新签名并对齐 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p release-assets

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::未读取到 KEYSTORE_BASE64！请检查 GitHub Repository Secrets 配置。"
            exit 1
          fi

          echo "检测到签名配置，开始还原证书..."
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > release.keystore
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          for APK_PATH in app/build/outputs/apk/release/*.apk; do
            [ -e "$APK_PATH" ] || continue
            FILENAME=$(basename "$APK_PATH")
            # 去掉文件名中可能自带的 -unsigned 后缀
            CLEAN_NAME="${FILENAME/-unsigned/}"
            ALIGNED_APK="aligned-${CLEAN_NAME}"
            FINAL_APK="release-assets/${CLEAN_NAME}"

            echo "正在对齐并签名: $FILENAME -> $FINAL_APK"
            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$APK_PATH" "$ALIGNED_APK"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$FINAL_APK" \
              "$ALIGNED_APK"

            # 验证签名是否真正成功
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$FINAL_APK"
            rm -f "$ALIGNED_APK"
          done

          rm -f release.keystore

      - name: Generate SHA-256 checksums
        run: |
          if [ -d "app/build/packs/" ]; then
            find app/build/packs/ -type f -exec cp {} release-assets/ \;
          fi
          cd release-assets
          sha256sum * > SHA256SUMS.txt


      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            release-assets/*
